version: "3.9"

services:
  backend-1:
    build: ./backend-api-1
    image: backend-flask:v1
    container_name: backend-1
    environment:
      - SERVICE_ID=Backend-1
      - FLASK_RUN_PORT=5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend-2:
    build: ./backend-api-2
    image: backend-flask:v1
    container_name: backend-2
    environment:
      - SERVICE_ID=Backend-2
      - FLASK_RUN_PORT=5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    image: frontend-nginx:v1
    container_name: frontend
    expose:
      - "80"

  rproxy:
    build: ./rproxy
    image: rproxy:v1
    container_name: rproxy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-1
      - backend-2
      - frontend
